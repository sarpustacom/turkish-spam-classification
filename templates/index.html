<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spam Detector</title>
  <meta name="description" content="Yapay zekâ destekli Türkçe mesaj analizi">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var theme = localStorage.getItem("theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#message">İçeriğe geç</a>

  <div class="container">
    <header class="header">
      <div>
        <h1 class="title">Spam Detector</h1>
        <p class="subtitle">Yapay zekâ destekli Türkçe mesaj analizi</p>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Koyu temaya geç">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </header>

    <main>
      <form class="card" id="predict-form" novalidate>
        <label class="field-label" for="message">Mesaj</label>
        <textarea
          id="message"
          name="message"
          rows="7"
          maxlength="{{ max_length }}"
          placeholder="Analiz etmek istediğiniz mesajı buraya yazın..."
          aria-describedby="char-count shortcut-hint"
          autocomplete="off"
          spellcheck="false"
        ></textarea>

        <div class="form-footer">
          <div class="meta">
            <span id="char-count" class="char-count" aria-live="polite">0 / {{ max_length }}</span>
            <span id="shortcut-hint" class="hint">Göndermek için <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn" disabled>
            <span class="spinner" aria-hidden="true"></span>
            <span class="btn-label">Analiz Et</span>
          </button>
        </div>

        <div class="error" id="error" role="alert" hidden></div>
      </form>

      <section class="card result" id="result" aria-live="polite" tabindex="-1" hidden>
        <p class="result-label" id="result-label"></p>
        <p class="result-score">
          Spam olasılığı: <strong id="result-score"></strong>
        </p>
        <div class="progress" role="progressbar" aria-label="Spam olasılığı"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <p class="result-description" id="result-description"></p>
        <button type="button" class="btn btn-secondary" id="reset-btn">Yeni mesaj analiz et</button>
      </section>
    </main>

    <footer class="footer">
      Mesajlar yalnızca analiz için kullanılır; saklanmaz.
    </footer>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
